name: Test & CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'videos/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'videos/**'
      - '.gitignore'

jobs:
  full-verification:
    name: Full Verification & E2E Test Suite (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'gui/pnpm-lock.yaml'

      - name: Rust Code Formatting Check
        run: cargo fmt --check

      - name: Clippy Linter Check
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Check All Targets
        run: cargo check --all-targets

      - name: Run Cargo Library Tests
        run: cargo test --lib

      - name: Build and Install CLI
        run: |
          cargo build --release
          mkdir -p ~/.cargo/bin
          cp target/release/cloak ~/.cargo/bin/cloak
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Frontend Dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: gui
        run: pnpm test -- --run

      - name: Build Frontend Bundle
        working-directory: gui
        run: pnpm run build

      - name: Build and Install GUI Desktop Binary
        run: |
          cargo build --release --manifest-path gui/src-tauri/Cargo.toml
          cp gui/src-tauri/target/release/cloak-gui ~/.cargo/bin/cloak-gui

      - name: Run Comprehensive End-to-End Suite
        run: ./tests/e2e_test.sh

  cross-platform-check:
    name: Cross-Platform Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check CLI Binary
        run: cargo check --bin cloak
