name: "Release Cloak Desktop & CLI"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test-gate:
    name: "Pre-Release Test Gate"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "gui/pnpm-lock.yaml"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Library Tests
        run: cargo test --lib

      - name: Install Frontend Dependencies
        working-directory: ./gui
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: ./gui
        run: pnpm test -- --run

      - name: Build CLI & GUI Binaries
        run: |
          cargo build --release
          mkdir -p ~/.cargo/bin
          cp target/release/cloak ~/.cargo/bin/cloak
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cd gui && pnpm run build && cd ..
          cargo build --release --manifest-path gui/src-tauri/Cargo.toml
          cp gui/src-tauri/target/release/cloak-gui ~/.cargo/bin/cloak-gui

      - name: Run End-to-End Test Suite
        run: ./tests/e2e_test.sh

  release:
    name: "Build & Publish Release Bundles"
    needs: [test-gate]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-13"
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "gui/pnpm-lock.yaml"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        working-directory: ./gui
        run: pnpm install --frozen-lockfile

      - name: Build CLI Binary for Self-Contained Bundle
        run: |
          cargo build --release ${{ matrix.args }}
          mkdir -p target/release
          if [ -f "target/aarch64-apple-darwin/release/cloak" ]; then
            cp target/aarch64-apple-darwin/release/cloak target/release/cloak
          elif [ -f "target/x86_64-apple-darwin/release/cloak" ]; then
            cp target/x86_64-apple-darwin/release/cloak target/release/cloak
          fi

      - name: Build Tauri Desktop App & Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./gui"
          tagName: ${{ github.ref_name }}
          releaseName: "Cloak v__VERSION__"
          releaseBody: "Cloak developer release for macOS (Apple Silicon and Intel)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
