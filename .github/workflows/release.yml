name: "Release Cloak Desktop & CLI"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test-gate:
    name: "Pre-Release Test Gate"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "gui/pnpm-lock.yaml"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            gui/src-tauri -> gui/src-tauri/target

      - name: Run Cargo Library Tests
        run: cargo test --lib

      - name: Install Frontend Dependencies
        working-directory: ./gui
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: ./gui
        run: pnpm test -- --run

      - name: Build CLI & GUI Binaries
        run: |
          cargo build --release
          mkdir -p ~/.cargo/bin
          cp target/release/cloak ~/.cargo/bin/cloak
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cd gui && pnpm run build && cd ..
          cargo build --release --manifest-path gui/src-tauri/Cargo.toml
          cp gui/src-tauri/target/release/cloak-gui ~/.cargo/bin/cloak-gui

      - name: Run End-to-End Test Suite
        run: ./tests/e2e_test.sh

  release:
    name: "Build & Publish Release Bundles"
    needs: [test-gate]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "gui/pnpm-lock.yaml"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            gui/src-tauri -> gui/src-tauri/target

      - name: Install frontend dependencies
        working-directory: ./gui
        run: pnpm install --frozen-lockfile

      - name: Build CLI Binary for Self-Contained Bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release ${{ matrix.args }}
          mkdir -p target/release
          if [ -f "target/${{ matrix.target }}/release/cloak" ]; then
            cp "target/${{ matrix.target }}/release/cloak" target/release/cloak
          fi
          touch target/release/cloak.exe

      - name: Build CLI Binary for Self-Contained Bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release ${{ matrix.args }}
          mkdir -p target/release
          if [ -f "target/${{ matrix.target }}/release/cloak.exe" ]; then
            cp "target/${{ matrix.target }}/release/cloak.exe" target/release/cloak.exe
          fi
          touch target/release/cloak

      - name: Build Tauri Desktop App & Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./gui"
          tagName: ${{ github.ref_name }}
          releaseName: "Cloak v__VERSION__"
          releaseBody: "Cloak release for macOS (Apple Silicon / Intel) and Windows (x86_64)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
