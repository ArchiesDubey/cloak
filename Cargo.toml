[package]
name = "cloak"
version = "0.5.2"
edition = "2021"
description = "Local-first hardware-backed secret manager & zero-leak proxy for developers and AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ArchiesDubey/cloak"
homepage = "https://github.com/ArchiesDubey/cloak"
keywords = ["secrets", "security", "ai-agents", "keychain", "touch-id"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[lib]
name = "cloak"
path = "src/lib.rs"

[[bin]]
name = "cloak"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
zeroize = { version = "1.8", features = ["derive", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
rpassword = "7.3"
anyhow = "1.0"

# Async & Proxy Server Dependencies
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"
rcgen = { version = "0.14", features = ["pem", "ring", "x509-parser"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
hyper = { version = "1.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
base64 = "0.22"
bytes = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
security-framework = "3.7"
security-framework-sys = "2.14"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
